# Render Blueprint Specification for BaseIndex Agent
# Deploys the Node.js/Express LangChain Backend + Telegram Bot on Render

services:
  - type: web
    name: baseindex-agent-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix packages/shared run build && cd apps/server && npm install --install-links && npm run build
    startCommand: cd apps/server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: BASE_CHAIN_ID
        value: "8453"
      - key: FRONTEND_URL
        value: https://baseindex-agent.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: CDP_API_KEY_NAME
        sync: false
      - key: CDP_API_KEY_PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MAX_SLIPPAGE_BPS
        value: "50"
